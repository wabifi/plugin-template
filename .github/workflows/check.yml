# Checks every pull request and every push to main. The build job installs from the lockfile and
# builds every plugin, as a release does. The dependencies job looks up every package in the
# lockfile in osv.dev with the OSV-Scanner release the automatic plugin review runs: the review
# notes a package with a known advisory, and this job fails on one, so you see it before you
# release. Neither needs a secret, so a repo made from this template runs its copy as it is.
name: Check

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - run: pnpm install --frozen-lockfile

      - run: pnpm build

  dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The review's scanner, checked against its digest, run as the review runs it: with a config
      # of its own that ignores nothing, so an osv-scanner.toml in this repo hides no advisory here
      # either. It exits 1 when any package has one.
      - name: Look up the lockfile's packages in osv.dev
        env:
          URL: https://github.com/google/osv-scanner/releases/download/v2.7.0/osv-scanner_linux_amd64
          SHA256: 160c6253e2922e9e0a6a9771c5c4c40a4b3c6090b34a3cdd5e80c96cc2e4218b
        run: |
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/osv-scanner" "$URL"
          echo "$SHA256  $RUNNER_TEMP/osv-scanner" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/osv-scanner"
          : > "$RUNNER_TEMP/osv-scanner.toml"
          "$RUNNER_TEMP/osv-scanner" scan source --config "$RUNNER_TEMP/osv-scanner.toml" --lockfile pnpm-lock.yaml
