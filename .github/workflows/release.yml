# Releases one plugin. Raise "version" in plugins/<id>/manifest.json, commit, then push a tag
# <id>@<version>, like acme.standup-board@0.1.0: release-on-tag.yml calls this workflow with it.
# The build job checks the tag and builds that plugin with read access only, because the build runs
# the plugin's code and every dependency's install script. The release job runs none of that code:
# it checks what the build hands over, attests plugin.js and attaches plugin.js and manifest.json
# to the tag's GitHub Release. The Wabifi catalog accepts only a plugin.js attested by this file in
# wabifi/plugin-template, so a plugin repo calls it there instead of keeping a copy.
name: Release

on:
  workflow_call:
    inputs:
      tag:
        description: The tag to release, <id>@<version>.
        type: string
        required: true

permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      id: ${{ steps.tag.outputs.id }}
      version: ${{ steps.tag.outputs.version }}
    steps:
      # The attestation names the commit the tag pointed to when it was pushed, so the build checks
      # out that commit, not the tag, which may have moved since. That holds only for a run a push
      # of this tag started.
      - name: Check that a push of the tag started this run
        id: pushed
        env:
          TAG: ${{ inputs.tag }}
          REF: ${{ github.ref }}
        run: |
          if [ "$REF" != "refs/tags/$TAG" ]; then
            echo "::error::This run was started by $REF, not by a push of the tag $TAG."
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Check the tag against the plugin's manifest
        id: tag
        env:
          TAG: ${{ inputs.tag }}
        run: node scripts/release/tag.mjs "$TAG"

      - run: pnpm install --frozen-lockfile

      - name: Build the plugin
        env:
          ID: ${{ steps.tag.outputs.id }}
        run: pnpm --filter "./plugins/$ID/desktop" build

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: |
            dist/${{ steps.tag.outputs.id }}/plugin.js
            dist/${{ steps.tag.outputs.id }}/manifest.json
          if-no-files-found: error
          retention-days: 1

  release:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # create the release and attach its files
      id-token: write # sign the provenance attestation
      attestations: write # store it
    env:
      TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: release

      # The build ran the plugin's code, so its id and version are checked as tag.mjs checks the
      # tag, and must spell the tag, before anything uses them.
      - name: Check the build's id and version against the tag
        id: check
        shell: bash
        env:
          ID: ${{ needs.build.outputs.id }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          export LC_ALL=C
          if [[ ! $ID =~ ^[a-z][a-z0-9.-]*$ || ! $VERSION =~ ^[0-9A-Za-z.+-]+$ || $TAG != "$ID@$VERSION" ]]; then
            echo "::error::The build's id and version are not the tag's."
            exit 1
          fi

      - name: Check the build's files
        run: |
          for file in plugin.js manifest.json; do
            if [ ! -f "release/$file" ] || [ -L "release/$file" ]; then
              echo "::error::The build did not produce $file."
              exit 1
            fi
          done

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: release/plugin.js

      # Wabifi Console reads a release's files from the webhook GitHub sends when the release is
      # published, so a new release is published with both attached: given files, gh creates a
      # draft, uploads them, then publishes it. An existing release gets them, then is published
      # in case an earlier run left it a draft.
      - name: Attach plugin.js and manifest.json to the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ID: ${{ needs.build.outputs.id }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" release/plugin.js release/manifest.json --clobber
            gh release edit "$TAG" --draft=false
          else
            gh release create "$TAG" release/plugin.js release/manifest.json --verify-tag --title "$ID $VERSION" --notes "$ID $VERSION"
          fi
