# Releases one plugin. Raise "version" in plugins/<id>/manifest.json, commit, then push a tag
# <id>@<version>, like acme.standup-board@0.1.0. This checks the tag, builds that plugin,
# attests its plugin.js and attaches plugin.js and manifest.json to the tag's GitHub Release.
# Another workflow can call it with the tag; it must grant the job's permissions below.
name: Release

on:
  push:
    tags: ["*@*"]
  workflow_call:
    inputs:
      tag:
        description: The tag to release, <id>@<version>.
        type: string
        required: true

permissions: {}

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # create the release and attach its files
      id-token: write # sign the provenance attestation
      attestations: write # store it
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || github.ref }}
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Check the tag against the plugin's manifest
        id: tag
        run: node scripts/release/tag.mjs "$TAG"

      - run: pnpm install --frozen-lockfile

      - name: Build the plugin
        env:
          ID: ${{ steps.tag.outputs.id }}
        run: pnpm --filter "./plugins/$ID/desktop" build

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/${{ steps.tag.outputs.id }}/plugin.js

      - name: Attach plugin.js and manifest.json to the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ID: ${{ steps.tag.outputs.id }}
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          gh release view "$TAG" > /dev/null 2>&1 || gh release create "$TAG" --verify-tag --title "$ID $VERSION" --notes "$ID $VERSION"
          gh release upload "$TAG" "dist/$ID/plugin.js" "dist/$ID/manifest.json" --clobber
